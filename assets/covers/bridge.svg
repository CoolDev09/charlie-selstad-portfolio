<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Warren truss: an editorial bridge schematic with a ten-pound tested-load label</title>
  <desc id="desc">Alternating triangular members form a stylized Warren truss. The illustration is not an exact construction drawing.</desc>
  <defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#262A2D" opacity=".12"/></pattern></defs>
  <rect width="800" height="600" fill="#F0F1F2"/>
  <rect x="28" y="28" width="744" height="544" rx="8" fill="white"/>
  <rect x="76" y="112" width="648" height="324" fill="url(#grid)"/>
  <rect x="58" y="62" width="14" height="14" fill="#F58220"/>
  <text x="86" y="75" fill="#262A2D" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2.4">STRUCTURE / LOAD / GEOMETRY</text>
  <text x="100" y="176" fill="#262A2D" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">TESTED LOAD</text>
  <text x="98" y="225" fill="#262A2D" font-family="Arial,sans-serif" font-size="48" font-weight="700">10<tspan font-size="23" dx="7">lb</tspan></text>
  <path d="M400 146V236M385 221L400 236L415 221" fill="none" stroke="#262A2D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M100 390L160 280L220 390L280 280L340 390L400 280L460 390L520 280L580 390L640 280L700 390" fill="none" stroke="#F58220" stroke-width="7" stroke-linejoin="round"/>
  <path d="M160 280H640M100 390H700" fill="none" stroke="#262A2D" stroke-width="7"/>
  <g fill="white" stroke="#262A2D" stroke-width="3"><circle cx="100" cy="390" r="7"/><circle cx="160" cy="280" r="7"/><circle cx="220" cy="390" r="7"/><circle cx="280" cy="280" r="7"/><circle cx="340" cy="390" r="7"/><circle cx="400" cy="280" r="7"/><circle cx="460" cy="390" r="7"/><circle cx="520" cy="280" r="7"/><circle cx="580" cy="390" r="7"/><circle cx="640" cy="280" r="7"/><circle cx="700" cy="390" r="7"/></g>
  <path d="M100 402L85 424H115ZM700 402L685 424H715Z" fill="#F0F1F2" stroke="#262A2D" stroke-width="2"/>
  <path d="M58 478H112" stroke="#F58220" stroke-width="5"/>
  <text x="58" y="533" fill="#262A2D" font-family="Arial,sans-serif" font-size="32" font-weight="700" letter-spacing="1">WARREN TRUSS</text>
</svg>
