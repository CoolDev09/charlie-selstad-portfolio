  <text x="485" y="220" fill="#F58220" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="2">CLAIM</text>
  <path d="M485 244H666M485 266H644M485 316H666M485 338H666M485 360H620" fill="none" stroke="white" stroke-width="4"/>
