<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Evidence to argument: an illustration of research and synthesis</title>
  <desc id="desc">Three source cards converge into one structured argument card, showing the organization of evidence into a clear claim.</desc>
