  <rect x="28" y="28" width="744" height="544" rx="8" fill="white"/>
  <rect x="76" y="112" width="648" height="324" fill="url(#grid)"/>
  <rect x="58" y="62" width="14" height="14" fill="#F58220"/>
  <text x="86" y="75" fill="#262A2D" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2.4">RESEARCH / REASONING / WRITING</text>
  <g fill="white" stroke="#262A2D" stroke-width="2"><rect x="103" y="147" width="174" height="82" rx="5"/><rect x="103" y="250" width="174" height="82" rx="5"/><rect x="103" y="353" width="174" height="82" rx="5"/></g>
  <g stroke="#262A2D" stroke-width="3"><path d="M127 175H196M127 192H250M127 209H224M127 278H202M127 295H250M127 312H226M127 381H198M127 398H250M127 415H222"/></g>
  <g fill="#F58220"><rect x="242" y="168" width="12" height="12"/><rect x="242" y="271" width="12" height="12"/><rect x="242" y="374" width="12" height="12"/></g>
